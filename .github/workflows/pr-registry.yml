name: Update PR Evidence Registry
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'neophilism/Debate-Engine'
    runs-on: ubuntu-latest
    concurrency:
      group: debate-pr-registry-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch authoritative GitHub PR state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-pr-registry.mjs
      - name: Commit changed machine-readable PR data
        run: |
          if git diff --quiet -- registry/prs.json; then
            echo "No PR registry changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/prs.json
          git commit -m "data: sync PR evidence from GitHub [skip ci]"
          git push origin HEAD:main
