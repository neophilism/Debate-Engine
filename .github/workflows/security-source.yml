name: Source and Dependency Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-javascript:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize security-extended CodeQL analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze and publish source findings
        uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: Audit runtime dependencies for high-severity vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact production dependency lock for this ephemeral audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refuse high or critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
