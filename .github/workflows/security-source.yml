name: Source and Dependency Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-javascript:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize security-extended CodeQL analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze and publish source findings
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Reject newly introduced high-severity dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Review all changed dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          license-check: false
