name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: debate_ci
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: debate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debate_ci -d debate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://debate_ci:test_only_password@localhost:5432/debate_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1
      - run: npm install --no-audit --no-fund
      - name: Apply every numbered database migration
        run: npm run db:migrate
      - name: Verify migration hashes and order
        run: npm run db:check
      - name: Run transactional database integrity tests
        run: npm run test:db
      - name: Rehearse actual PostgreSQL backup and restore using fictional candidates
        env:
          PDE_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run test:db:restore-rehearsal

  real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test real mixed-audio original-to-montage rendering
        run: node --test tests/media.integration.mjs

  chromium-public:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: debate_ci
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: debate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debate_ci -d debate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://debate_ci:test_only_password@localhost:5432/debate_ci
      PDE_BROWSER_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1
      - run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate disposable test database
        run: npm run db:migrate
      - name: Build actual web application
        run: npm run build
      - name: Start live local Next.js HTTP server
        run: |
          npm run start -- --port 3100 > /tmp/pde-browser-server.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 /tmp/pde-browser-server.log
          exit 1
      - name: Test desktop, mobile and keyboard interactions in Chromium
        run: npm run test:browser

  clamav-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual ClamAV daemon (free GitHub-hosted runner)
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clamav-daemon
      - name: Launch isolated ClamAV with CI-only synthetic signature
        run: bash scripts/start-ci-clamd.sh
      - name: Verify real native ClamAV scan, detection and outage fail-closed
        run: node --experimental-strip-types --test tests/clamav-live.integration.ts

  s3-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1
      - run: npm install --no-audit --no-fund
      - name: Install FFmpeg for real but fictional MP4 and WAV fixture bytes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Destroy primary MinIO, restore from independent fixture backup, and verify privacy and checksums
        env:
          PDE_S3_RECOVERY_FIXTURES: "true"
        run: npm run test:s3:restore-rehearsal

  candidate-pilot:
    name: Two distinct signed-session browser candidate pilot
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: debate_ci
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: debate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debate_ci -d debate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://debate_ci:test_only_password@localhost:5432/debate_ci
      PDE_BROWSER_URL: https://127.0.0.1:3443
      PDE_CI_PILOT_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production application and browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser for real candidate sessions
        run: npx playwright install --with-deps chromium
      - name: Apply all migrations to disposable PostgreSQL only
        run: npm run db:migrate
      - name: Create unlogged ephemeral HMAC key and install isolated CI auth fixture
        run: |
          TEST_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$TEST_KEY"
          echo "PDE_CI_AUTH_KEY=$TEST_KEY" >> "$GITHUB_ENV"
      - name: Replace auth module inside THIS CI checkout only
        run: node scripts/install-ci-pilot-auth.mjs
      - name: Compile actual production Next.js application in isolated runner
        run: npm run build
      - name: Start the complete localhost Next.js application
        run: |
          npm run start -- --port 3100 > /tmp/pde-candidate-pilot-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 110 /tmp/pde-candidate-pilot-server.log
          exit 1
      - name: Generate one-day CI-only self-signed HTTPS certificate
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -keyout /tmp/pde-ci-tls-key.pem -out /tmp/pde-ci-tls-cert.pem > /dev/null 2>&1
          chmod 600 /tmp/pde-ci-tls-key.pem
      - name: Start CI-only HTTPS origin without changing application security rules
        run: |
          node scripts/ci-local-https-proxy.mjs > /tmp/pde-ci-proxy.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --insecure --fail --silent https://127.0.0.1:3443/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 80 /tmp/pde-ci-proxy.log
          exit 1
      - name: Complete two-account candidate registration, reviewed publication, reciprocal sequence and privacy browser pilot
        run: node scripts/browser-two-candidate-pilot.mjs
